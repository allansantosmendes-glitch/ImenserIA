<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saúde em Campo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0C371D">
<link rel="icon" href="marca/icone-192.png">
<link rel="apple-touch-icon" href="marca/icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de campo — barra superior com estado da conexão, conteúdo em coluna única
   no celular; no computador a navegação vira um trilho lateral. Paleta "mata e rio". */
/* Paleta tirada dos logos: verde-mata e dourado da Ação Missionária Norte (Pará),
   creme das letras, laranja da MUB como segundo destaque. */
:root {
  --bg: #F7F4EA;
  --surface: #FFFFFF;
  --surface-2: #EEEADD;
  --ink: #13231A;
  --muted: #5B675E;
  --line: #DDD8C8;
  --primary: #17603A;
  --primary-ink: #FFFFFF;
  --primary-soft: #DCECDF;
  --brand-dark: #0C371D;
  --brand-ink: #F8F1DC;
  --gold: #FDB413;
  --gold-ink: #1D1806;
  --orange: #FA850E;
  --river: #2A6A8C;
  --river-soft: #D6E7F0;
  --sun: #A9640A;
  --sun-soft: #FCE8C4;
  --danger: #B23E2C;
  --danger-soft: #F6DDD7;
  --shadow: 0 1px 2px rgba(12,55,29,.06), 0 8px 24px rgba(12,55,29,.09);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1510; --surface: #14211A; --surface-2: #1C2C23; --ink: #EEEADC; --muted: #A4AF9F;
    --line: #2A3B30; --primary: #5FC48F; --primary-ink: #07170E; --primary-soft: #1A3A28;
    --brand-dark: #08251A; --brand-ink: #F8F1DC; --gold: #FDB92B; --gold-ink: #1D1806; --orange: #FB9534;
    --river: #74B6D8; --river-soft: #17303D; --sun: #F3B54A; --sun-soft: #3A2C10;
    --danger: #EF8A75; --danger-soft: #3E201A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1510; --surface: #14211A; --surface-2: #1C2C23; --ink: #EEEADC; --muted: #A4AF9F;
  --line: #2A3B30; --primary: #5FC48F; --primary-ink: #07170E; --primary-soft: #1A3A28;
  --brand-dark: #08251A; --brand-ink: #F8F1DC; --gold: #FDB92B; --gold-ink: #1D1806; --orange: #FB9534;
  --river: #74B6D8; --river-soft: #17303D; --sun: #F3B54A; --sun-soft: #3A2C10;
  --danger: #EF8A75; --danger-soft: #3E201A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--river); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-size: .85em; letter-spacing: .01em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--brand-dark); color: var(--brand-ink); border-bottom: 3px solid var(--gold);
  padding-block: 9px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand-dark); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--brand-ink); color: var(--brand-dark); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 20px; height: 20px; stroke-width: 2.2; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.08rem; display: block; line-height: 1.1; }
.brand small { opacity: .82; font-size: .78rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > div { min-width: 0; }
.net {
  display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px;
  padding: 6px 12px 6px 9px; font-size: .82rem; font-weight: 700; white-space: nowrap;
}
.net svg { width: 18px; height: 18px; }
.net.off { background: var(--sun-soft); color: var(--sun); }
.net.on { background: var(--primary-soft); color: var(--primary); }
.icon-btn { background: transparent; border: 0; color: inherit; padding: 6px; border-radius: 8px; display: grid; place-items: center; }
.demo-band {
  background: var(--sun-soft); color: var(--ink); font-size: .8rem; text-align: center;
  padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.layout { display: grid; grid-template-columns: 1fr; min-height: 0; }
main {
  padding-block: 18px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  width: 100%; max-width: 980px; margin: 0 auto; min-width: 0;
}
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs button {
  background: none; border: 0; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: .72rem; color: var(--muted); position: relative;
}
nav.tabs button[aria-current="page"] { color: var(--primary); font-weight: 700; }
nav.tabs button.novo span.plus { width: 48px; height: 48px; margin-top: -22px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); border: 3px solid var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); }
nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); }
.badge { background: var(--sun); color: var(--surface); border-radius: 999px; font-size: .68rem; font-weight: 700; padding: 1px 6px; line-height: 1.4; }
nav.tabs .extra { display: none; }

@media (min-width: 900px) {
  .layout { grid-template-columns: 220px 1fr; }
  nav.tabs {
    position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px);
    grid-template-columns: 1fr; grid-auto-rows: min-content; gap: 4px; border-top: 0; border-right: 1px solid var(--line);
    padding: 18px 12px; background: var(--bg);
  }
  nav.tabs button { flex-direction: row; gap: 10px; font-size: .95rem; padding: 10px 12px; border-radius: 10px; }
  nav.tabs button[aria-current="page"] { background: var(--primary-soft); }
  nav.tabs button.novo span.plus { width: 22px; height: 22px; margin: 0; box-shadow: none; }
  nav.tabs button.novo span.plus svg { width: 16px; height: 16px; }
  nav.tabs .badge { position: static; margin-left: auto; }
  nav.tabs .extra { display: flex; }
  main { padding-block: 26px 48px; }
}

/* ---------- Componentes ---------- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 8px; }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 11px 16px; font-weight: 700; min-height: 46px;
}
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.ghost { background: transparent; }
.btn.sun { background: var(--sun); border-color: var(--sun); color: var(--surface); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.pend { background: var(--sun-soft); color: var(--sun); }
.chip.ok { background: var(--primary-soft); color: var(--primary); }
.chip.risk { background: var(--danger-soft); color: var(--danger); }
.chip.river { background: var(--river-soft); color: var(--river); }
.filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filter-chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: .86rem; white-space: nowrap; }
.filter-chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Início */
.hello h1 { margin-top: 2px; }
.sync-card { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; border-radius: var(--r); padding: 16px; border: 1px solid transparent; }
.sync-card .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; grid-row: span 2; }
.sync-card.off { background: var(--sun-soft); }
.sync-card.off .ico { background: var(--sun); color: var(--surface); }
.sync-card.on { background: var(--primary-soft); }
.sync-card.on .ico { background: var(--primary); color: var(--primary-ink); }
.sync-card .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width .3s ease; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.quick button { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.quick button.main { background: var(--brand-dark); color: var(--brand-ink); border-color: var(--brand-dark); box-shadow: inset 0 -4px 0 var(--gold); }
.quick button b { font-size: 1rem; }
.quick button small { opacity: .8; font-size: .8rem; }

.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 13px 14px; background: none; border: 0; text-align: left; width: 100%; align-items: center; }
.item:hover { background: var(--surface-2); }
.item .t { font-weight: 700; min-width: 0; }
.item .s { color: var(--muted); font-size: .86rem; min-width: 0; }
.item .chips { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; }
.alert-item { display: grid; grid-template-columns: 8px 1fr auto; gap: 12px; padding: 12px 14px; align-items: center; background: none; border: 0; width: 100%; text-align: left; }
.alert-item .bar { align-self: stretch; border-radius: 4px; background: var(--sun); }
.alert-item.alta .bar { background: var(--danger); }
.alert-item:hover { background: var(--surface-2); }

.search { position: relative; }
.search input { width: 100%; padding: 12px 14px 12px 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); min-height: 48px; }
.search svg { position: absolute; left: 13px; top: 13px; color: var(--muted); }

/* Formulário */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.steps div { font-size: .76rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.steps div::before { content: ""; height: 5px; border-radius: 4px; background: var(--line); }
.steps div.done::before, .steps div.now::before { background: var(--primary); }
.steps div.now { color: var(--ink); font-weight: 700; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px 16px; margin: 0; display: grid; gap: 14px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 600; padding: 0 6px; font-size: 1.02rem; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 700; font-size: .9rem; }
.field .hint { font-size: .8rem; color: var(--muted); }
.field input[type="text"], .field input[type="date"], .field input[type="number"], .field select, .field textarea, .field input[type="password"] {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-height: 46px;
}
.field textarea { min-height: 80px; resize: vertical; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-block; padding: 9px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: .9rem; }
.opt input:checked + span { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 700; }
.opt input:focus-visible + span { outline: 3px solid var(--river); outline-offset: 2px; }
.gps { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px; border-radius: 12px; background: var(--river-soft); color: var(--ink); }
.gps svg { color: var(--river); }
.wizard-foot {
  position: sticky; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; gap: 10px; padding: 12px 0; background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.wizard-foot .btn { flex: 1; }
@media (min-width: 900px) { .wizard-foot { bottom: 0; } }
.member { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--primary-soft); color: var(--primary); font-family: var(--f-display); }
.avatar.F { background: var(--river-soft); color: var(--river); }
.consent { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.consent input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--primary); }
dl.review { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: .92rem; }
dl.review dt { color: var(--muted); }
dl.review dd { margin: 0; min-width: 0; }

/* Painel */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--f-display); font-size: 1.9rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .84rem; color: var(--muted); }
.charts { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 720px) { .charts { grid-template-columns: 1fr 1fr; } }
.charts .card { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pyr { display: grid; grid-template-columns: 1fr 48px 1fr; gap: 4px 6px; align-items: center; font-size: .78rem; }
.pyr .l { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.pyr .r { display: flex; align-items: center; gap: 6px; }
.pyr .bar { height: 14px; border-radius: 3px; min-width: 2px; }
.pyr .l .bar { background: var(--river); }
.pyr .r .bar { background: var(--primary); }
.pyr .mid { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.pyr .v { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.4em; }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hbars { display: flex; flex-direction: column; gap: 9px; }
.hbar { display: grid; grid-template-columns: minmax(96px, 38%) 1fr 54px; gap: 10px; align-items: center; font-size: .86rem; }
.hbar .track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
.hbar.river .track i { background: var(--river); }
.hbar.sun .track i { background: var(--sun); }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.hbar .lab { min-width: 0; overflow-wrap: anywhere; }

/* Sincronizar */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch input { appearance: none; width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked { background: var(--primary); }
.switch input:checked::after { transform: translateX(22px); }
.flow { display: grid; grid-template-columns: 1fr; gap: 8px; counter-reset: f; }
@media (min-width: 720px) { .flow { grid-template-columns: repeat(4, 1fr); } }
.flow div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: .88rem; display: flex; flex-direction: column; gap: 4px; }
.flow div b { font-family: var(--f-display); font-size: .98rem; }
.flow div b::before { counter-increment: f; content: counter(f) " · "; color: var(--primary); }

/* Overlays */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 15, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 680px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0;
  padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet .grab { width: 44px; height: 5px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 20px; max-height: 86vh; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: .92rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (min-width: 900px) { .toast { bottom: 24px; } }
.login { position: fixed; inset: 0; z-index: 80; background: var(--brand-dark); color: var(--brand-ink); border-top: 4px solid var(--gold); overflow: auto; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login .box { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px; }
.login .card { color: var(--ink); }
.login h1 { font-size: 2.2rem; }
table.agg { border-collapse: collapse; width: 100%; font-size: .84rem; font-variant-numeric: tabular-nums; }
table.agg th, table.agg td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: right; white-space: nowrap; }
table.agg th:first-child, table.agg td:first-child { text-align: left; }
table.agg th { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.scroll-x { overflow-x: auto; }

    d.moradores.slice(0, 2).forEach((m, x) => { const ta = new Date(t); ta.setMinutes(ta.getMinutes() + 15 + x * 12); d.atendimentos.push(atendimento(m, ta)); });

/* ---------- Utilidades ---------- */
function idadeDec(nasc, ref = HOJE) { return Math.max(0, (new Date(ref) - new Date(nasc + 'T12:00:00')) / (365.25 * 864e5)); }
function idade(nasc, ref) { return Math.floor(idadeDec(nasc, ref)); }
function idadeTxt(nasc) {
  if (!nasc) return '';
  const d = idadeDec(nasc);
  if (d < 1) { const m = Math.floor(d * 12); return m + (m === 1 ? ' mês' : ' meses'); }
  const a = Math.floor(d); return a + (a === 1 ? ' ano' : ' anos');
}
function composicao(mor) {
  const ids = mor.filter(m => m.nascimento).map(m => idade(m.nascimento));
  return { total: mor.length, criancas: ids.filter(i => i <= 11).length, adolescentes: ids.filter(i => i >= 12 && i <= 17).length, adultos: ids.filter(i => i >= 18 && i <= 59).length, idosos: ids.filter(i => i >= 60).length };
}
const ehHoje = d => new Date(d).toDateString() === HOJE.toDateString();
const fmtData = d => new Date(d).toLocaleDateString('pt-BR');
const fmtHora = d => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
function fmtQuando(d) { const x = new Date(d); const ontem = new Date(HOJE); ontem.setDate(ontem.getDate() - 1); if (ehHoje(d)) return 'hoje, ' + fmtHora(d); if (x.toDateString() === ontem.toDateString()) return 'ontem, ' + fmtHora(d); return fmtData(d); }
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const fmtNum = (v, c = 1) => v == null ? '—' : Number(v).toFixed(c).replace('.', ',');
const pendentes = () => S.domicilios.filter(d => d.pend);
const iniciais = n => n.split(' ').filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase();
const cnsMask = c => c ? c.slice(0, 3) + ' •••• •••• ' + c.slice(-4) : '';
const cpfMask = c => c ? '•••.•••.' + c.slice(6, 9) + '-' + c.slice(9) : '';
const achaMorador = (d, id) => d.moradores.find(m => m.id === id);
const cidNome = c => (CID.find(x => x[0] === c) || [])[1] || '';
function pendTexto(p) { if (!p) return ''; const t = []; if (p.cadastro) t.push(p.cadastro); if (p.atend) t.push(p.atend + (p.atend === 1 ? ' atendimento' : ' atendimentos')); return t.join(' + '); }
function pendItens(p) { return p ? (p.cadastro ? 1 : 0) + (p.atend || 0) : 0; }
function marcarPend(d, cad, atend = 0) {
  const p = d.pend || { cadastro: null, atend: 0 };
  if (cad && p.cadastro !== 'Nova família') p.cadastro = cad;
  p.atend += atend; d.pend = p; d.atualizadoEm = new Date().toISOString();
}

function vitaisAlertas(a, anos) {
  const r = [];
  if (anos >= 18 && a.pas && a.pad) {
    if (a.pas >= 180 || a.pad >= 110) r.push({ nivel: 'alta', txt: 'Pressão muito elevada' });
    else if (a.pas >= 140 || a.pad >= 90) r.push({ nivel: 'media', txt: 'Pressão elevada' });
    else if (a.pas < 90) r.push({ nivel: 'media', txt: 'Pressão baixa' });
  }
  if (a.temp) { if (a.temp >= 39.5) r.push({ nivel: 'alta', txt: 'Febre alta' }); else if (a.temp >= 37.8) r.push({ nivel: 'media', txt: 'Febre' }); }
  if (a.sat) { if (a.sat < 90) r.push({ nivel: 'alta', txt: 'Saturação muito baixa' }); else if (a.sat < 94) r.push({ nivel: 'media', txt: 'Saturação baixa' }); }
  if (a.glic) { if (a.glic < 70) r.push({ nivel: 'alta', txt: 'Hipoglicemia' }); else if (a.glic >= 250) r.push({ nivel: 'alta', txt: 'Glicemia muito alta' }); else if (a.glic >= 200) r.push({ nivel: 'media', txt: 'Glicemia alta' }); }
  if (anos >= 12 && a.fc) { if (a.fc > 100) r.push({ nivel: 'media', txt: 'Frequência cardíaca alta' }); else if (a.fc < 50) r.push({ nivel: 'media', txt: 'Frequência cardíaca baixa' }); }
  const imc = calcIMC(a.peso, a.altura); const c = classificaIMC(imc, anos);
  if (c && c.nivel !== 'ok') r.push({ nivel: c.nivel, txt: c.txt + ` (IMC ${fmtNum(imc)})` });
  return r;
}
function ultimoAtend(d, mId) { return d.atendimentos.filter(a => a.moradorId === mId).sort((a, b) => b.data.localeCompare(a.data))[0]; }

function alertasDom(d) {
  const a = [];
  d.moradores.forEach(m => {
    const anos = idadeDec(m.nascimento); const pn = m.nome.split(' ')[0];
    const ult = ultimoAtend(d, m.id);
    if (ult) {
      if (ult.encaminhamento.sim) a.push({ nivel: ult.encaminhamento.urgencia === 'Urgente' ? 'alta' : 'media', texto: `${pn}: encaminhar para ${ult.encaminhamento.destino} (${ult.encaminhamento.urgencia.toLowerCase()})`, m });
      vitaisAlertas(ult, anos).filter(v => v.nivel === 'alta').forEach(v => a.push({ nivel: 'alta', texto: `${pn}: ${v.txt.toLowerCase()} no último atendimento`, m }));
    }
    if (anos < 5 && m.vacina === 'Não') a.push({ nivel: 'alta', texto: `${pn} (${idadeTxt(m.nascimento)}): vacinação atrasada`, m });
    if (m.condicoes.includes('Gestante') && !ult) a.push({ nivel: 'alta', texto: `${pn}: gestante (${m.semanas || '?'} sem.) sem atendimento registrado`, m });
    if (m.condicoes.includes('Acamado(a)')) a.push({ nivel: 'media', texto: `${pn}: acamado(a), precisa de visita domiciliar`, m });
  });
  if (d.tratamento === 'Sem tratamento' && d.moradores.some(m => idade(m.nascimento) < 5)) a.push({ nivel: 'media', texto: 'Água sem tratamento com criança menor de 5 anos' });
  return a.sort((x, y) => (x.nivel === 'alta' ? 0 : 1) - (y.nivel === 'alta' ? 0 : 1));
}

const FILTROS = [['todos', 'Todas'], ['pendente', 'Aguardando envio'], ['prioridade', 'Prioridade'], ['retorno', 'Encaminhamento ou retorno'], ['gestante', 'Com gestante'], ['beneficio', 'Com benefício'], ['cronico', 'Hipertensos / diabéticos']];
function filtrarDoms() {
  const q = UI.busca.trim().toLowerCase();
  return S.domicilios.filter(d => {
    const f = UI.filtro;
    if (f === 'pendente' && !d.pend) return false;
    if (f === 'prioridade' && !alertasDom(d).some(a => a.nivel === 'alta')) return false;
    if (f === 'retorno' && !d.atendimentos.some(a => a.encaminhamento.sim || a.retorno.sim)) return false;
    if (f === 'gestante' && !d.moradores.some(m => m.condicoes.includes('Gestante'))) return false;
    if (f === 'beneficio' && !d.beneficiosFamilia.some(b => b !== 'Nenhum')) return false;
    if (f === 'cronico' && !d.moradores.some(m => m.condicoes.includes('Hipertensão') || m.condicoes.includes('Diabetes'))) return false;
    return !q || [d.codigo, d.localidade, d.responsavelNome, ...d.moradores.map(m => m.nome)].join(' ').toLowerCase().includes(q);

/* Curva de IMC para idade (crianças e adolescentes) */
function curvaIMC(imc, anos) {
  const W = 320, H = 150, L = 30, R = 8, T = 10, B = 24;
  const x = a => L + a / 19 * (W - L - R);
  const y = v => T + (1 - (v - 10) / 24) * (H - T - B);
  const pts = k => Array.from({ length: 39 }, (_, i) => { const a = i / 2; return [x(a), y(imcRef(a)[k])]; });
  const band = [...pts('zm2'), ...pts('zp2').reverse()].map(p => p.join(',')).join(' ');
  const line = k => pts(k).map(p => p.join(',')).join(' ');
  const c = classificaIMC(imc, anos);
  const cor = c.nivel === 'ok' ? 'var(--primary)' : c.nivel === 'alta' ? 'var(--danger)' : 'var(--sun)';
  const iy = Math.max(10, Math.min(34, imc));
  return `<div class="card curva"><div class="row between"><h3>IMC para a idade</h3><span class="chip ${c.nivel === 'ok' ? 'ok' : c.nivel === 'alta' ? 'risk' : 'pend'}">${h(c.txt)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de IMC para idade com o ponto da criança">
      <polygon points="${band}" style="fill:var(--primary-soft)"/>
      <polyline points="${line('med')}" style="fill:none;stroke:var(--primary);stroke-width:1.5"/>
      <polyline points="${line('zm2')}" style="fill:none;stroke:var(--danger);stroke-width:1;stroke-dasharray:3 3"/>
      <polyline points="${line('zp2')}" style="fill:none;stroke:var(--sun);stroke-width:1;stroke-dasharray:3 3"/>
      ${[0, 5, 10, 15, 19].map(a => `<text x="${x(a)}" y="${H - 6}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${a}a</text>`).join('')}
      ${[12, 18, 24, 30].map(v => `<text x="${L - 4}" y="${y(v) + 3}" text-anchor="end" style="fill:var(--muted);font-size:10px">${v}</text><line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:.6"/>`).join('')}
      <circle cx="${x(Math.min(19, anos))}" cy="${y(iy)}" r="5.5" style="fill:${cor};stroke:var(--surface);stroke-width:2"/>
    </svg>
    <p class="muted" style="font-size:.78rem">Faixa verde: entre −2 e +2 escores-z (referência OMS, valores aproximados no protótipo). IMC ${fmtNum(imc)} aos ${fmtNum(anos)} anos.</p></div>`;
}

const medRow = () => `<div class="med-row">

function atualizarCalculosAtend() {
  const f = document.getElementById('form-atend'); if (!f) return;
  const v = n => num(f.elements[n].value);
  const anos = Number(f.dataset.anos);
  const a = { pas: v('pas'), pad: v('pad'), fc: v('fc'), temp: v('temp'), glic: v('glic'), sat: v('sat'), peso: v('peso'), altura: v('altura') };
  const imc = calcIMC(a.peso, a.altura);
  const cl = classificaIMC(imc, anos);
  document.getElementById('imc-out').innerHTML = imc ? `IMC <b class="num">${fmtNum(imc)}</b> kg/m² · <span class="chip ${cl.nivel === 'ok' ? 'ok' : cl.nivel === 'alta' ? 'risk' : 'pend'}">${h(cl.txt)}</span>` : 'Preencha peso e altura para calcular o IMC.';
  document.getElementById('curva-out').innerHTML = imc && anos < 19 ? curvaIMC(imc, anos) : '';
  document.getElementById('vitais-alertas').innerHTML = vitaisAlertas({ ...a, peso: null }, anos).map(x => `<span class="chip ${x.nivel === 'alta' ? 'risk' : 'pend'}">${h(x.txt)}</span>`).join('');
}
function buscaCID(q) {
  q = q.trim().toLowerCase(); const el = document.getElementById('cid-res');
  if (!q) { el.innerHTML = ''; return; }
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const l = CID.filter(([c, n]) => c.toLowerCase().startsWith(q) || norm(n).includes(norm(q))).slice(0, 6);
  el.innerHTML = l.length ? l.map(([c, n]) => `<button type="button" data-act="cid-pick" data-c="${c}" data-n="${h(n)}"><span class="mono">${c}</span> ${h(n)}</button>`).join('') : '<p class="muted" style="font-size:.84rem;padding:6px 2px">Código não encontrado na lista offline. Escreva só a hipótese.</p>';
}

}
const radios = (campo, lista, valor) => `<div class="opts" role="radiogroup">${lista.map(o => `<label class="opt"><input type="radio" name="${campo}" data-f="${campo}" value="${h(o)}" ${valor === o ? 'checked' : ''}><span>${h(o)}</span></label>`).join('')}</div>`;
const checks = (grupo, lista, valores) => `<div class="opts">${lista.map(o => `<label class="opt"><input type="checkbox" data-g="${grupo}" value="${h(o)}" ${valores.includes(o) ? 'checked' : ''}><span>${h(o)}</span></label>`).join('')}</div>`;
const getPath = (o, p) => p.split('.').reduce((x, k) => x?.[k], o);
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); ks.reduce((x, k) => x[k] ??= {}, o)[last] = v; }
function compHint() {
  const c = S.rascunho.comp; const soma = ['criancas', 'adolescentes', 'adultos', 'idosos'].reduce((n, k) => n + (Number(c[k]) || 0), 0);
  if (!c.total) return 'Informe o total e a divisão por idade.';
  return Number(c.total) === soma ? `<span style="color:var(--primary)">Soma confere: ${soma} pessoas.</span>` : `<span style="color:var(--sun)">A soma das faixas (${soma}) é diferente do total (${c.total}).</span>`;
}

  if (UI.passo === 3) {

function validarRascunho() {
  const r = S.rascunho; const f = [];
  if (!r.localidade) f.push('Comunidade / localidade (passo 1)');
  if (!r.responsavelNome.trim()) f.push('Nome do responsável (passo 1)');
  if (!r.comp.total) f.push('Total de moradores (passo 1)');
  if (!r.moradia) f.push('Tipo de moradia (passo 2)');
  if (!r.agua || !r.tratamento) f.push('Origem e tratamento da água (passo 2)');
  if (!r.esgoto) f.push('Esgoto / banheiro (passo 2)');
  if (!r.renda) f.push('Renda familiar (passo 3)');
  if (!r.beneficiosFamilia.length) f.push('Benefícios: marque “Nenhum” se não receber (passo 3)');
  if (!r.moradores.length) f.push('Ao menos um morador (passo 4)');
  else if (!r.moradores.some(m => m.parentesco === 'Responsável')) f.push('Indicar quem é o responsável entre os moradores (passo 4)');
  return f;
}

function abrirMoradorForm(i) {

function vSync() {
  const pend = pendentes();
  const itens = pend.reduce((n, d) => n + pendItens(d.pend), 0);
  return `<div class="stack">
    <h1>Sincronizar</h1>
    <div class="card"><label class="switch"><span><b>Conexão com a internet</b><br><span class="muted" style="font-size:.86rem">No protótipo, ligue para simular a volta do sinal. No app real isso é detectado sozinho.</span></span><input type="checkbox" id="sw-net" data-act="toggle-net" ${S.online ? 'checked' : ''} aria-label="Simular conexão"></label></div>
    <div class="sync-card ${S.online ? 'on' : 'off'}">
      <div class="ico">${ico(S.online ? 'cloud' : 'wifiOff')}</div>
      <h2 class="num">${itens} ${itens === 1 ? 'registro' : 'registros'} na fila</h2>
      <p class="muted">${pend.length} ${pend.length === 1 ? 'família' : 'famílias'} · ${S.online ? 'pronto para enviar' : 'tudo seguro no aparelho, envia quando houver sinal'}</p>
      <div class="actions" style="flex-direction:column;align-items:stretch">
        ${UI.sincronizando ? `<div class="progress"><i style="width:${UI.progresso}%"></i></div><p class="muted num" style="font-size:.86rem">Enviando… ${UI.progresso}%</p>` :
        `<button class="btn primary" data-act="sync-now" ${!S.online || !itens ? 'disabled' : ''}>${ico('cloud')} ${S.online ? 'Enviar agora' : 'Aguardando internet'}</button>`}
      </div>
    </div>
    ${pend.length ? `<h2>Na fila</h2><div class="list">${pend.map(d => `<button class="item" data-act="abrir-dom" data-id="${d.id}"><span class="t">${h(d.responsavelNome)}</span><span class="mono muted">${h(d.codigo)}</span><span class="s">${h(pendTexto(d.pend))} · ${fmtQuando(d.atualizadoEm)}${(d.atualizadoPor || d.criadoPor) ? ' · por ' + h((d.atualizadoPor || d.criadoPor).nome) : ''}</span></button>`).join('')}</div>` : ''}
    <h2>Histórico de envios</h2>
    <div class="list">${[...S.syncs].reverse().map(s => `<div class="item"><span class="t num">${s.qtd} ${s.qtd === 1 ? 'registro enviado' : 'registros enviados'}</span><span class="chip ok">Concluído</span><span class="s">${fmtQuando(s.quando)}</span></div>`).join('')}</div>
    <h2>Como o envio funciona</h2>
    <div class="flow">
      <div><b>Coleta</b><span class="muted">Família, moradores e atendimentos são salvos no próprio celular, com ou sem sinal.</span></div>
      <div><b>Fila</b><span class="muted">Cada registro ganha um código único e entra na fila de envio.</span></div>
      <div><b>Envio</b><span class="muted">Com internet, a fila sobe para a nuvem. Se cair no meio, retoma de onde parou.</span></div>
      <div><b>Confirmação</b><span class="muted">O servidor confirma cada registro e o celular marca como “Na nuvem”.</span></div>
    </div>
  </div>`;
}
function sincronizar() {
  const pend = pendentes();
  if (!S.online || !pend.length || UI.sincronizando) return;
  const total = pend.reduce((n, d) => n + pendItens(d.pend), 0);
  UI.sincronizando = true; UI.progresso = 0; render();
  let k = 0;
  const passo = () => {
    pend[k].pend = null; k++;
    UI.progresso = Math.round(k / pend.length * 100);
    if (k < pend.length) { if (UI.tab === 'sync') render(); setTimeout(passo, 420); }
    else {
      S.syncs.push({ quando: new Date().toISOString(), qtd: total });
      UI.sincronizando = false; salvar(); render();
      toast(`${total} ${total === 1 ? 'registro enviado' : 'registros enviados'} para a nuvem`);
    }
  };
  setTimeout(passo, 420);
}

/* ---------- Painel (calculado no próprio aparelho) ---------- */
const FAIXAS = [[0, 4], [5, 9], [10, 14], [15, 19], [20, 29], [30, 39], [40, 49], [50, 59], [60, 69], [70, 200]];
function periodo() {
  const fim = d => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
  let ate = fim(HOJE), de = null, rot = 'Todo o período';
  if (UI.periodo === '15' || UI.periodo === '30') { de = new Date(HOJE); de.setDate(de.getDate() - Number(UI.periodo)); de.setHours(0, 0, 0, 0); rot = `Últimos ${UI.periodo} dias`; }
  if (UI.periodo === 'custom') { if (UI.de) de = new Date(UI.de + 'T00:00:00'); if (UI.ate) ate = fim(UI.ate + 'T12:00:00'); rot = `${de ? fmtData(de) : 'início'} a ${fmtData(ate)}`; }
  return { de, ate, rot };
}
function dadosPainel(soSinc = false) {
  const p = periodo();
  const doms = S.domicilios.filter(d => (UI.local === 'Todas' || d.localidade === UI.local) && new Date(d.criadoEm) <= p.ate && (!soSinc || !d.pend || d.pend.cadastro !== 'Nova família'));
  const atends = doms.flatMap(d => d.atendimentos.map(a => ({ a, d }))).filter(({ a }) => { const t = new Date(a.data); return t <= p.ate && (!p.de || t >= p.de); });
  const pes = doms.flatMap(d => d.moradores);
  const tem = c => pes.filter(m => m.condicoes.includes(c)).length;
  const benef = OP.benefPessoa.map(b => ({ b, familias: doms.filter(d => d.beneficiosFamilia.includes(b)).length, pessoas: pes.filter(m => m.beneficios.includes(b)).length }));
  const lista = atends.filter(({ a }) => a.encaminhamento.sim || a.retorno.sim).map(({ a, d }) => ({ a, d, m: achaMorador(d, a.moradorId) }))
    .sort((x, y) => OP.urgencia.indexOf(y.a.encaminhamento.urgencia || 'Eletivo') - OP.urgencia.indexOf(x.a.encaminhamento.urgencia || 'Eletivo') + (y.a.encaminhamento.sim - x.a.encaminhamento.sim) * 10);
  return {
    p, doms, atends, pes, lista,
    familias: doms.length, moradores: pes.length, atendimentos: atends.length,
    gestantes: tem('Gestante'), hipertensos: tem('Hipertensão'), diabeticos: tem('Diabetes'),
    menores5: pes.filter(m => idade(m.nascimento) < 5).length, idosos: pes.filter(m => idade(m.nascimento) >= 60).length,
    cond: OP.condicoes.map(c => [c, tem(c)]).filter(([, v]) => v).sort((a, b) => b[1] - a[1]),
    semAgua: doms.filter(d => d.tratamento === 'Sem tratamento').length,
    semBanheiro: doms.filter(d => ['Sem banheiro', 'A céu aberto'].includes(d.esgoto)).length,
    semEnergia: doms.filter(d => d.energia === 'Não').length,
    semPosto: doms.filter(d => d.posto.acesso === 'Não').length,
    famComBenef: doms.filter(d => d.beneficiosFamilia.some(b => b !== 'Nenhum')).length,
    pesComBenef: doms.reduce((n, d) => n + (Number(d.pessoasComBeneficio) || 0), 0),
    benef, renda: OP.renda.map(r => [r, doms.filter(d => d.renda === r).length]),
    enc: { total: lista.filter(x => x.a.encaminhamento.sim).length, urg: lista.filter(x => x.a.encaminhamento.urgencia === 'Urgente').length, ret: lista.filter(x => x.a.retorno.sim).length },
    piramide: FAIXAS.map(([a, b]) => ({ faixa: b > 100 ? a + '+' : a + '–' + b, M: pes.filter(m => m.sexo === 'M' && idade(m.nascimento) >= a && idade(m.nascimento) <= b).length, F: pes.filter(m => m.sexo === 'F' && idade(m.nascimento) >= a && idade(m.nascimento) <= b).length }))
  };
}

const hbar = (lab, v, total, cls = '', mostrarPct = true) => `<div class="hbar ${cls}"><span class="lab">${h(lab)}</span><span class="track"><i style="width:${total ? Math.max(1.5, v / total * 100) : 0}%"></i></span><span class="val">${mostrarPct ? pct(v, total) + '%' : v}</span></div>`;

}

/* ---------- Entrada: criar conta e entrar com e-mail e senha ----------
   Protótipo: as contas ficam só neste aparelho e a senha é guardada como hash.
   Na versão real, as contas ficam no Supabase Auth e só entra quem tem convite. */
const PAPEIS = OP.profissionais;
async function hashSenha(email, senha) {
  const txt = email.trim().toLowerCase() + ':' + senha;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { let x = 5381; for (const c of txt) x = (x * 33 + c.charCodeAt(0)) >>> 0; return 'f' + x.toString(16); }
}
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e.trim());

function campoRascunho(t) {
  if (!S.rascunho || UI.tab !== 'novo') return;
  const r = S.rascunho;
  if (t.dataset.f) {
    const f = t.dataset.f;
    setPath(r, f, t.type === 'checkbox' ? t.checked : t.value);
    if (f === 'localidade') r.microarea = String(OP.localidades.indexOf(t.value) + 1).padStart(2, '0');
    if (f.startsWith('comp.')) { const el = document.getElementById('comp-hint'); if (el) el.innerHTML = compHint(); }
  } else if (t.dataset.g) {
    const g = t.dataset.g; let set = new Set(r[g]);
    if (t.checked) { if (t.value === 'Nenhum') set = new Set(['Nenhum']); else { set.delete('Nenhum'); set.add(t.value); } } else set.delete(t.value);
    const mudou = (t.value === 'Nenhum' && t.checked && r[g].length > 0) || (t.value !== 'Nenhum' && r[g].includes('Nenhum'));
    r[g] = [...set];
    if (mudou) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  }
  salvar();
}

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'form-login') {
    const email = f.querySelector('#l-email').value.trim().toLowerCase(), senha = f.querySelector('#l-senha').value;
    if (!email || !senha) { erroForm('login-erro', 'Preencha o e-mail e a senha.'); return; }
    const conta = S.contas.find(c => c.email === email);
    if (!conta) { erroForm('login-erro', 'Não existe conta com esse e-mail neste aparelho. Se é seu primeiro acesso, toque em “Criar minha conta”.'); return; }
    hashSenha(email, senha).then(hs => hs === conta.hash ? entrarComo(conta) : erroForm('login-erro', 'Senha incorreta. Confira e tente de novo.'));
    return;
  }
  if (f.id === 'form-conta') {

    const nome = v('#c-nome').trim().replace(/\s+/g, ' '), email = v('#c-email').trim().toLowerCase();

    if (!emailOk(email)) return erroForm('conta-erro', 'Escreva um e-mail válido, por exemplo nome@gmail.com.');

    if (v('#c-senha').length < 6) return erroForm('conta-erro', 'A senha precisa ter pelo menos 6 caracteres.');
    if (v('#c-senha') !== v('#c-senha2')) return erroForm('conta-erro', 'As duas senhas estão diferentes. Digite de novo.');
    hashSenha(email, v('#c-senha')).then(hash => {
      const conta = { id: uid(), nome, email, papel: v('#c-papel'), equipe: v('#c-eq'), hash, criadoEm: new Date().toISOString() };
      S.contas.push(conta); entrarComo(conta); toast('Conta criada. Bem-vindo(a), ' + nome.split(' ')[0] + '!');
    });
    return;
  }
  if (f.id === 'form-morador') {
    const fd = new FormData(f);
    const cond = fd.getAll('condicoes');
    const nasc = fd.get('nascimento');
    const crianca = nasc && idade(nasc) < 12;
    const m = {
      id: uid(), nome: (fd.get('nome') || '').trim(), sexo: fd.get('sexo'), nascimento: nasc, parentesco: fd.get('parentesco'),
      cns: (fd.get('cns') || '').replace(/\D/g, ''), cpf: (fd.get('cpf') || '').replace(/\D/g, ''),
      raca: fd.get('raca'), escolaridade: fd.get('escolaridade'), alfabetizado: fd.get('alfabetizado') === 'Sim' ? true : fd.get('alfabetizado') === 'Não' ? false : null,
      ocupacao: fd.get('ocupacao'), beneficios: fd.getAll('beneficios'), condicoes: cond,
      semanas: cond.includes('Gestante') ? (Number(fd.get('semanas')) || null) : null, outraCondicao: cond.includes('Outra') ? fd.get('outraCondicao') : '',
      vacina: fd.get('vacina') || '', caderneta: crianca ? (fd.get('caderneta') || null) : null,
      medUsa: fd.get('medUsa') === 'Sim', medQual: fd.get('medUsa') === 'Sim' ? fd.get('medQual') : ''
    };
    const i = f.dataset.i;
    if (i !== '') { m.id = S.rascunho.moradores[i].id; S.rascunho.moradores[i] = m; } else S.rascunho.moradores.push(m);
    if (m.parentesco === 'Responsável' && !S.rascunho.responsavelNome) S.rascunho.responsavelNome = m.nome;
    salvar(); fecharSheet(); render(); toast(m.nome.split(' ')[0] + ' salvo(a) no cadastro');
    return;
  }
  if (f.id === 'form-atend') {
    const fd = new FormData(f);
    const d = S.domicilios.find(x => x.id === f.dataset.d);
    const nomes = fd.getAll('med_nome'), qtds = fd.getAll('med_qtd'), poss = fd.getAll('med_pos');
    const dataSel = fd.get('data'); const agora = new Date();
    const quando = dataSel ? new Date(dataSel + 'T' + agora.toTimeString().slice(0, 8)) : agora;
    const at = {
      id: uid(), moradorId: f.dataset.m, data: quando.toISOString(), profTipo: fd.get('profTipo'), profNome: quem().nome, por: quem(),
      queixa: fd.get('queixa'), pas: num(fd.get('pas')), pad: num(fd.get('pad')), fc: num(fd.get('fc')), temp: num(fd.get('temp')), glic: num(fd.get('glic')), sat: num(fd.get('sat')),
      peso: num(fd.get('peso')), altura: num(fd.get('altura')), hipotese: fd.get('hipotese'), cid: fd.get('cid'), conduta: fd.get('conduta'),
      meds: nomes.map((n, k) => ({ nome: n.trim(), qtd: Number(qtds[k]) || 1, pos: (poss[k] || '').trim() })).filter(x => x.nome), exames: fd.get('exames'),
      evolucao: (fd.get('evolucao') || '').trim(),
      encaminhamento: fd.get('encSim') === 'Sim' ? { sim: true, destino: fd.get('encDestino') || 'A definir', urgencia: fd.get('encUrg') } : { sim: false },
      retorno: fd.get('retSim') === 'Sim' ? { sim: true, dias: num(fd.get('retDias')) } : { sim: false }
    };
    d.atendimentos.push(at); marcarPend(d, null, 1); salvar(); render();
    abrirMorador(d.id, at.moradorId);
    toast(S.online ? 'Atendimento salvo. Pronto para enviar.' : 'Atendimento salvo no aparelho. Será enviado quando houver internet.');
  }
});

function salvarDom() {
  const r = S.rascunho; const falta = validarRascunho();
  if (falta.length) { toast('Complete os campos indicados antes de salvar'); return; }
  if (!r.consentimento) { toast('Marque a autorização da família para salvar'); return; }
  const agora = new Date().toISOString();
  const base = { ...r, comodos: Number(r.comodos) || 1, pessoasComBeneficio: Number(r.pessoasComBeneficio) || r.moradores.filter(m => m.beneficios.length).length, posto: { ...r.posto, km: num(r.posto.km) } };
  let id;
  if (r.id) {
    const i = S.domicilios.findIndex(d => d.id === r.id);
    S.domicilios[i] = { ...base, versao: (r.versao || 1) + 1, atualizadoPor: quem() };
    marcarPend(S.domicilios[i], 'Atualização de cadastro'); id = r.id;
  } else {
    id = uid();
    const d = { ...base, id, codigo: 'FAM-' + String(S.domicilios.length + 1).padStart(4, '0'), criadoEm: agora, atualizadoEm: agora, criadoPor: quem(), versao: 1, pend: null, atendimentos: [] };
    marcarPend(d, 'Nova família'); S.domicilios.unshift(d);
  }
  S.rascunho = null; UI.passo = 0; UI.tab = 'familias'; salvar(); render(); window.scrollTo(0, 0);
  abrirDom(id);
  toast('Família salva no aparelho. Agora registre o atendimento de cada morador.');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharSheet(); });

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !EMBUTIDO) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* sem suporte */ }
}
render();
</script>
</body>
</html>
